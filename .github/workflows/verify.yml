name: Reproduce Nomogenesis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check saved Testnet receipts
        run: npm run verify:evidence
      - name: Reproduce complete local NEAR lifecycle
        run: |
          ulimit -Sn "$(ulimit -Hn)"
          npm run verify
